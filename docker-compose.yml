services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-novel
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - /mnt/aicv/esther/novel-ai/mem0/qdrant-data:/qdrant/storage

  mem0:
    image: mem0ai/mem0:latest
    container_name: mem0-novel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://172.17.0.1:11434
      - QDRANT_URL=http://qdrant-novel:6333
      - LLM_MODEL=qwen2.5:32b
      - EMBEDDER_MODEL=qwen2.5:32b
    depends_on:
      - qdrant
